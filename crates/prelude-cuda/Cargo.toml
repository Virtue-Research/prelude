[package]
name = "prelude-cuda"
version = "0.1.0"
edition = "2024"
build = "build.rs"
description = "CUDA device implementation for Prelude inference engine."
license = "Apache-2.0"

[lib]
name = "prelude_cuda"
path = "src/lib.rs"

[features]
default = []
# FlashAttention-3 (Hopper SM90) backend via the candle-flash-attn-v3 crate.
# Opt-in: heavy CUTLASS hopper kernel compile. Enable PRELUDE_ATTN_FA3=1 at
# runtime to prefer it over FA4 on the paged attention path.
flash-attn-v3 = ["dep:candle-flash-attn-v3"]
# candle-fa3-0102 backend: vendored vLLM 0.22 FA3 hopper kernel (bf16/hdim128/
# sm90) linked as a prebuilt static lib via raw-ptr FFI — no candle-core 0.10.2
# dependency. build.rs runs crates/candle-fa3-0102/_build_v3_kernel_prelude.sh
# if the lib is missing. Default attention backend when compiled in (implied
# by prelude-server's `cuda` feature); opt out with PRELUDE_ATTN_FA3_0102=0.
fa3-0102 = []
# GGUF quantized linear kernels (llama.cpp MMQ/MMVQ). Kept opt-in because
# safetensors BF16/FP16 models do not use them and the CUDA templates are
# expensive to compile.
gguf-quant = ["dep:quant-gemm"]
quant-gemm = ["dep:quant-gemm"]

[build-dependencies]
prelude-kernelbuild = { workspace = true }

[dependencies]
prelude-core = { path = "../prelude-core", features = ["cuda"] }
candle-core = { workspace = true, features = ["cuda"] }
cudarc = { version = "0.19.4", features = ["std", "driver", "f16", "nvrtc", "fallback-dynamic-loading", "cuda-version-from-build-system"], default-features = false }
half = { version = "2.7.1", features = ["bytemuck"] }
float8.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
tracing.workspace = true
bc-mimalloc.workspace = true
inventory = "0.3"

# Kernel crates — all independently publishable, referenced through
# `[workspace.dependencies]` dual specs so they stay path-linked locally but
# fall back to crates.io versions if someone consumes them standalone.
flash-attn-v4  = { workspace = true }
candle-flash-attn-v3 = { workspace = true, optional = true }
flashinfer     = { workspace = true }
deepgemm       = { workspace = true }
cutlass-gemm   = { workspace = true }
quant-gemm     = { workspace = true, optional = true }
cula           = { workspace = true, features = ["dsl"] }
causal-conv1d  = { workspace = true }
tvm-static-ffi = { workspace = true }

# gpu_ops_bench temporarily disabled — needs migration from candle_core
# [[bin]]
# name = "gpu_ops_bench"
# path = "src/bin/gpu_ops_bench/main.rs"

[[bin]]
name = "fused_ops_test"
path = "src/bin/fused_ops_test.rs"

[[bin]]
name = "bench_kernel"
path = "src/bin/bench_kernel.rs"
